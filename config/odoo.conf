[options]
; --- MASTER PASSWORD ---
admin_passwd_file = /run/secrets/odoo_master_password

; --- PATHS ---
; Matches the volumes defined in your docker-compose.yml
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; --- PERFORMANCE TUNING (For 8GB RAM / 4 Cores) ---
; 'workers' enables Multiprocessing.
; Rule: (CPU Cores * 2) + 1. Assuming i5 has 4 cores = 9.
; However, since you only have 2 active users, we limit this to 5 to save RAM.
workers = 5

; Memory Limits per Worker (in Bytes)
; Soft Limit: 640 MB. Worker is recycled after finishing task if memory exceeds this.
limit_memory_soft = 671088640
; Hard Limit: 768 MB. Worker is killed immediately if memory exceeds this (Prevents freezing).
limit_memory_hard = 805306368

; Time Limits (in Seconds)
; Prevents long operations (like big reports) from hanging the server forever.
limit_time_cpu = 600
limit_time_real = 1200

; --- BACKGROUND TASKS ---
; Number of threads for scheduled actions (emails, backups).
max_cron_threads = 1

; --- NETWORK & PROXY ---
; Essential for running behind a proxy or in Docker to get correct client IPs.
proxy_mode = True
http_port = 8069
longpolling_port = 8072

; --- LOGGING ---
log_level = info
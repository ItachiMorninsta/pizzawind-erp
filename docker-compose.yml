services:
  web:
    image: odoo:18.0
    depends_on:
      - db
    # We removed "ports" here. Direct access to 8069 is now blocked.
    # You MUST go through Nginx.
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD_FILE=/run/secrets/postgresql_password
    secrets:
      - postgresql_password 
      - odoo_master_password  # <--- New Secret      
    restart: always

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_password
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data   
    secrets:
      - postgresql_password
    restart: always

  nginx:
    image: nginx:latest
    # This maps Windows Port 8080 -> Container Port 80
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: always
volumes:
  odoo-web-data:
    
    name: pizzawind-erp_odoo-web-data
  odoo-db-data:
    
    name: pizzawind-erp_odoo-db-data

secrets:
  postgresql_password:
    file: odoo_pg_pass
  odoo_master_password:  # <--- New Secret
    file: odoo_master_pass